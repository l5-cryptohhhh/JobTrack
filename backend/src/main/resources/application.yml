spring:
  application:
    name: jobtrack-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobtrack}
    username: ${DB_USER:jobtrack}
    password: ${DB_PASSWORD:jobtrack}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    # In produzione imposta JWT_SECRET con una stringa casuale di almeno 32 caratteri
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    expiration-minutes: 1440
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}

server:
  port: ${PORT:8080}
